# Pre-commit hooks for viavitae-control.
# Install: .venv/bin/pip3 install pre-commit && .venv/bin/pre-commit install
# `default_install_hook_types` makes `pre-commit install` wire BOTH the
# pre-commit (file hygiene) and commit-msg (provenance trailer) git hooks.
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.3
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
  # commit-msg stage: enforce the provenance trailer required by
  # policies/AI_WORKFLOW_POLICY.md §3.11. Bypassable (--no-verify) and inactive
  # until `pre-commit install`; an early-feedback aid, not the control.
  - repo: local
    hooks:
      - id: commit-provenance
        name: commit provenance trailer (ai:<tier>)
        entry: bash scripts/check_commit_provenance.sh
        language: system
        stages: [commit-msg]
        always_run: true
      # Editing the public expiry twin is the exact moment metadata can leak back in,
      # and it is the moment the two copies can drift. Both checks are scoped to that
      # one file so unrelated commits stay cheap. The sync check reads the confidential
      # register outside this repo; if it cannot, it exits 2 and blocks the commit —
      # "unable to verify" is never recorded as "in sync".
      - id: secret-register-anti-leak
        name: public secret register exposes no identifiers
        entry: bash scripts/check_public_register.sh docs/SECRETS_INVENTORY.md
        language: system
        files: ^docs/SECRETS_INVENTORY\.md$
        pass_filenames: false
      - id: secret-register-sync
        name: secret register twin matches the confidential register
        entry: bash scripts/reconcile_secret_register.sh
        language: system
        files: ^docs/SECRETS_INVENTORY\.md$
        pass_filenames: false
