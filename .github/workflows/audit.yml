name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A 14-day expiry warning is worthless if the only thing that reads it is a push.
  # Without a schedule, a quiet month lets a credential expire unnoticed and the gate
  # reports "green" about a state nobody looked at since.
  schedule:
    - cron: '30 6 * * *'   # daily 06:30 UTC
  workflow_dispatch:        # manual re-check right after a rotation

jobs:
  audit:
    runs-on: ubuntu-latest
    # Least privilege for the built-in token: this job reads the repo from the
    # git checkout and never writes back through GITHUB_TOKEN.
    permissions:
      contents: read
    # Bounded so a stalled provider read (observed: `data.github_organization`
    # "Still reading… [15m40s]") cannot hold the runner for an hour. The full
    # refresh of 31 repos needs ~20 min, so the ceiling sits just above that.
    timeout-minutes: 25
    env:
      ORG: Via-Vitae
      # Bridge secret to env var — `secrets` context is not available in `if:`
      # conditionals (GitHub Actions limitation), but env vars are.
      HAS_ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (tag v4)

      - name: Read the declared Terraform pin
        id: tfpin
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1 (tag v4)
        with:
          terraform_version: ${{ steps.tfpin.outputs.version }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (backend=false)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      # Placed ahead of every credential-dependent step on purpose: a step after a
      # failure is skipped, and a skipped docs gate is indistinguishable from a
      # passing one in the check list. This needs no secrets, no network and no
      # Terraform, so it can and must fail on its own merits.
      - name: Check plan self-citations
        run: |
          chmod +x scripts/check_plan_selfcite.sh
          ./scripts/check_plan_selfcite.sh docs/superpowers/plans/*.md

      # Manifest conformance moved to its own `pin-guard` job below, so that
      # requiring it does not make the secret-dependent audit job a merge
      # dependency. See P1-26.

      # The audit register is a compliance artifact that asserts counts about itself
      # (findings per table, evidence numbering, PART headings, markdown column counts).
      # Four edits in one session broke it silently and each was caught by a throwaway
      # script that then vanished, so the check is permanent here. Same placement rule as
      # above: no secrets, no network, must fail on its own merits before the credential
      # steps — a docs gate skipped behind a credential failure proves nothing.
      - name: Check audit register integrity
        run: |
          chmod +x scripts/check_audit_register.py
          python3 scripts/check_audit_register.py \
            docs/security/pre-deployment-independent-audit-2026-10-26.md \
            docs/superpowers/specs/*.md

      # Metadata-only expiry gate on docs/SECRETS_INVENTORY.md: no secrets, no
      # network, so it fails on its own merits ahead of the credential steps.
      # Red here means a dated credential expires within 14 days or already did.
      - name: Check secret inventory expiry
        run: |
          chmod +x scripts/check_secret_inventory.sh
          ./scripts/check_secret_inventory.sh docs/SECRETS_INVENTORY.md

      # The expiry gate only reads DATES, so a register that publishes vault paths,
      # host paths, account ids and backup media serials sails through it green. This
      # gate asserts the opposite property: the public twin exposes nothing an attacker
      # can target. Same contract as above — no secrets, no network, fails on its own
      # merits, and it sits before the credential steps for the same reason.
      - name: Check public secret register (anti-leak)
        run: |
          chmod +x scripts/check_public_register.sh
          ./scripts/check_public_register.sh docs/SECRETS_INVENTORY.md

      # Credential gates run BEFORE `Terraform plan` on purpose: a plan failure
      # skips every later step, so a gate parked downstream can never report a
      # verdict. The gate's exit 2 means "could not run" (surfaced as a warning),
      # which keeps a skipped check from masquerading as a pass.
      - name: Check CI credential (capability + least privilege)
        env:
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: |
          chmod +x scripts/check_ci_credential.sh
          ./scripts/check_ci_credential.sh

      - name: Detect drift (requires ORG_READ_TOKEN)
        if: env.HAS_ORG_READ_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          chmod +x scripts/detect_drift.sh
          ./scripts/detect_drift.sh

      # Inventory drift (above) proves the repo LIST matches reality. This proves
      # the declared MERGE CONTROLS match reality, by asking the live API every run
      # instead of trusting a stored plan. Red here means a control documented in
      # repos_data.tf is not the control in force on that branch.
      - name: Assert live controls (requires ORG_READ_TOKEN)
        if: env.HAS_ORG_READ_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          chmod +x scripts/assert_live_controls.sh
          ./scripts/assert_live_controls.sh

      - name: Fail loudly if ORG_READ_TOKEN is absent
        if: ${{ !env.HAS_ORG_READ_TOKEN }}
        run: |
          echo "::error::ORG_READ_TOKEN secret is not set. Drift detection cannot run."
          echo "::error::Mint a READ-ONLY fine-grained PAT (repository access = All repositories, private repositories included; Metadata + Administration read-only; NO Organization administration while nothing declares a root github_organization; no Contents/Workflows/Secrets; expiring) and add it as the ORG_READ_TOKEN repository secret. The credential contract is in provider.tf."
          echo "::error::Do NOT reuse your interactive credential (\`gh auth token\`) and do NOT mint a classic PAT with admin:org/repo/workflow to make this step pass. CI only plans; it must not hold write power."
          exit 1

      - name: Terraform plan
        env:
          # Read-only fine-grained PAT; the pre-flight gate above rejects anything
          # write-capable. Plan never applies (no apply workflow, no environment).
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          # billing_email has no default (GDPR Art. 5(1)(c)); CI provides a
          # placeholder so plan can run. This is read-only — plan never applies.
          TF_VAR_billing_email: ci-placeholder-not-applied
        run: terraform plan -no-color -input=false

      - name: Assert toolchain pin
        run: |
          PIN=$(cat .terraform-version)
          ACTUAL=$(terraform version -json | jq -r '.terraform_version')
          if [ "$PIN" != "$ACTUAL" ]; then
            echo "::error::.terraform-version ($PIN) != installed ($ACTUAL)"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # pin-guard: the manifest-conformance check promoted to its own job so it can be
  # a required status check WITHOUT dragging the whole audit into the merge gate.
  # P1-26 recorded the gap: `audit` already runs this guard, but as an advisory
  # step it can only warn, so a pin that contradicts toolchain.yml can be merged
  # anyway - a human clearing `provenance` walks straight past a red I2.
  #
  # Deliberately minimal, because a required check that cannot report freezes every
  # PR in the repo and this ruleset has no bypass actors to escape with. Needs: one
  # runner, one checkout, one shell script. Needs NO secrets, NO network, NO
  # Terraform and NO provider reads - unlike `audit`, which depends on
  # TF_GITHUB_TOKEN, ORG_READ_TOKEN and a `terraform plan` against the live org.
  # Requiring `audit` instead would turn any credential expiry into a repo-wide
  # merge lockout, which is the outcome the pnpm allow-list incident produced by
  # accident on three repos.
  #
  # ORDERING, not cosmetic: do not start requiring this context until the job
  # reports on a real PR from main. Confirm the check-run name from an actual run
  # before applying repo_rulesets.tf.
  pin-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (tag v4)

      # Exit contract: 0 clean, 1 violation, 2 nothing-checkable. A 2 fails this
      # job too - an unchecked invariant must never look like a satisfied one.
      - name: Check toolchain pins match the manifest
        run: |
          chmod +x scripts/check_toolchain_pins.sh
          ./scripts/check_toolchain_pins.sh toolchain.yml .github/workflows
