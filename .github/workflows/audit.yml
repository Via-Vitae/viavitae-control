name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # Bridge secret to env var — `secrets` context is not available in `if:`
      # conditionals (GitHub Actions limitation), but env vars are.
      HAS_ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.1

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (backend=false)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          # billing_email has no default (GDPR Art. 5(1)(c)); CI provides a
          # placeholder so plan can run. This is read-only — plan never applies.
          TF_VAR_billing_email: ci-placeholder-not-applied
        run: terraform plan -no-color -input=false

      - name: Assert toolchain pin
        run: |
          PIN=$(cat .terraform-version)
          ACTUAL=$(terraform version -json | jq -r '.terraform_version')
          if [ "$PIN" != "$ACTUAL" ]; then
            echo "::error::.terraform-version ($PIN) != installed ($ACTUAL)"
            exit 1
          fi

      - name: Detect drift (requires ORG_READ_TOKEN)
        if: env.HAS_ORG_READ_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ORG: Via-Vitae
        run: |
          chmod +x scripts/detect_drift.sh
          ./scripts/detect_drift.sh

      # Inventory drift (above) proves the repo LIST matches reality. This proves
      # the declared MERGE CONTROLS match reality, by asking the live API every run
      # instead of trusting a stored plan. Red here means a control documented in
      # repos_data.tf is not the control in force on that branch.
      - name: Assert live controls (requires ORG_READ_TOKEN)
        if: env.HAS_ORG_READ_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ORG: Via-Vitae
        run: |
          chmod +x scripts/assert_live_controls.sh
          ./scripts/assert_live_controls.sh

      - name: Fail loudly if ORG_READ_TOKEN is absent
        if: ${{ !env.HAS_ORG_READ_TOKEN }}
        run: |
          echo "::error::ORG_READ_TOKEN secret is not set. Drift detection cannot run."
          echo "::error::Create an org-read token with admin:org (read) scope and add it as a repository secret."
          exit 1
