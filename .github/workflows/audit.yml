name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    # Job-level ceiling (P1-13). A healthy run costs about two minutes: fmt, init, validate,
    # a plan whose org read takes ~9s, and the drift check. Set at the job level rather than on
    # the `Terraform plan` step because this project's gates are `run:` steps, and step-level
    # timeouts are only reliably honoured on action (`uses:`) steps. Without this, a credential
    # that cannot read the org makes the provider retry until it gives up, and every push burns
    # ~20 minutes of free-plan minutes to produce the same red check (observed 2026-10-12 and
    # 2026-10-13 at 20m07s and 20m08s). Fail fast, and let the log name the cause.
    timeout-minutes: 15
    env:
      # Bridge secret to env var — `secrets` context is not available in `if:`
      # conditionals (GitHub Actions limitation), but env vars are.
      HAS_ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.1

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (backend=false)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          # billing_email has no default (GDPR Art. 5(1)(c)); CI provides a
          # placeholder so plan can run. This is read-only — plan never applies.
          TF_VAR_billing_email: ci-placeholder-not-applied
        run: terraform plan -no-color -input=false

      - name: Assert toolchain pin
        run: |
          PIN=$(cat .terraform-version)
          ACTUAL=$(terraform version -json | jq -r '.terraform_version')
          if [ "$PIN" != "$ACTUAL" ]; then
            echo "::error::.terraform-version ($PIN) != installed ($ACTUAL)"
            exit 1
          fi

      - name: Detect drift (requires ORG_READ_TOKEN)
        if: env.HAS_ORG_READ_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ORG: Via-Vitae
        run: |
          chmod +x scripts/detect_drift.sh
          ./scripts/detect_drift.sh

      - name: Fail loudly if ORG_READ_TOKEN is absent
        if: ${{ !env.HAS_ORG_READ_TOKEN }}
        run: |
          echo "::error::ORG_READ_TOKEN secret is not set. Drift detection cannot run."
          echo "::error::Create an org-read token with admin:org (read) scope and add it as a repository secret."
          exit 1
